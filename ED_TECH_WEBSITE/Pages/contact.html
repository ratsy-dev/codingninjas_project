    <main>
      <a href="../Pages/index.html"
        ><img src="../Multimedia/new_cn_logo.svg" alt="coding_ninjas_logo"
      /></a>
      <section>
        <h1>Contact Details</h1>
        <article>
          <p>For inquiries, you can reach us via email or phone:</p>
          <p>
            Email:<a href="mailto:contact@codingninjas.com"
              >contact@codingninjas.com</a
            >
          </p>
          <p>Phone:<a href="tel:1800-123-3598">1800-123-3598</a></p>
        </article>
      </section>
      <section>
        <h1>Location Map</h1>
        <article>
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7746166.754556593!2d64.149045825!3d18.560148600000016!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2c13c4bcfd305%3A0x2b9907f299a466a7!2sCodeNinja%20Pvt%20Ltd.!5e0!3m2!1sen!2sin!4v1756034436890!5m2!1sen!2sin"

            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </article>
      </section>
      <section>
        <article>
          <form>
            <fieldset>
              <legend>Feedback Form</legend>
              <br />
              <div>
                <label for="name">Name:</label>
                <input id="name" type="text" name="name" required />
              </div>
              <br />
              <div>
                <label for="email">Email:</label>
                <input id="email" type="email" name="email" required />
              </div>
              <br />
              <div>
                <label for="sub">Subject:</label>
                <input id="sub" type="text" name="sub" required />
              </div>
              <br />
              <div>
                <label for="msg">Message:</label>
                <textarea id="msg" name="msg" rows="5" cols="20"></textarea>
              </div>
              <br />
              <input type="submit" name="submit" value="Submit" />
            </fieldset>
          </form>
        </article>
      </section>
    </main>
  </body>
</html>
